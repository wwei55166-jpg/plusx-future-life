name: Repair Sea 4K playback
on:
  push:
    paths:
      - '.github/workflows/repair-sea-4k.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Safari 4K stream
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          curl --fail --location --retry 3 'https://github.com/wwei55166-jpg/plusx-future-life/releases/download/v1.1-story-4k/PlusX_The_Sea_We_Leave_90s_4K.mp4' --output /tmp/sea-source.mp4
          ffmpeg -hide_banner -loglevel warning -y -i /tmp/sea-source.mp4 -map 0:v:0 -map 0:a:0 -c:v libx264 -preset veryfast -b:v 6500k -maxrate 8M -bufsize 13M -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 -c:a copy -f hls -hls_time 2 -hls_playlist_type vod -hls_segment_filename 'sea-4k-%03d.ts' sea-4k.m3u8
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration -of json sea-4k.m3u8
      - name: Save stream and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sea-4k-*.ts sea-4k.m3u8
          git rm .github/workflows/repair-sea-4k.yml
          git commit -m 'Prepare Safari-compatible 4K playback for The Sea We Leave'
          git push
